app = "store-demo-gv"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  # "suspend" rather than "stop": the machine's memory is snapshotted, so a
  # cold link opened in front of a prospect resumes in well under a second
  # instead of paying a full container boot.
  auto_stop_machines = "suspend"
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
